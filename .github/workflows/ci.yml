name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # engine-strict=true exige a versão exata; `.nvmrc` cobre o Node, o passo
  # abaixo normaliza o npm (mesmo padrão dos Dockerfiles).
  NPM_VERSION: '11.9.0'

jobs:
  quality:
    name: quality (lint, format, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  unit:
    name: unit (Jest/Vitest)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      # Cobertura foi avaliada nesta história e revertida: @vitest/coverage-v8
      # e @vitest/coverage-istanbul puxam glob@10.5.0 (depreciado) via
      # test-exclude@7.0.2, e a única correção via `overrides` esbarra na
      # política de baseline que veta esse campo
      # (test/foundation.test.mjs — "mantém ESLint 10 coordenado sem
      # mecanismos de bypass"). `c8` standalone foi testado como
      # alternativa e não captura cobertura real do Vitest (o runtime
      # transforma os arquivos via esbuild/Vite; sem a integração nativa,
      # a cobertura bruta do V8 não remapeia para o código-fonte). Fica
      # como lacuna registrada, não uma correção feita às pressas.
      - run: npm run test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: reports/unit
          retention-days: 14

  integration:
    name: integration (PactumJS + Mongo real)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      # Sem setup-node aqui: todo o npm/node usado neste job roda dentro do
      # container (`docker run ... npm run test:integration`), nada no
      # runner precisa de Node diretamente.
      # Sobe só mongo + mongo-init (compose.yaml já resolve o replica set
      # rs0 com retry — docker/mongo/init-replica-set.sh); reaproveita a
      # mesma infra do `npm run test:docker` local em vez de reimplementar
      # a inicialização do Mongo na workflow.
      - run: docker compose up -d --wait mongo mongo-init
      - run: docker build --target build -f apps/api/Dockerfile -t finbank-ci-api .
      - name: Rodar test:integration contra o Mongo real
        run: |
          docker run --rm \
            --network finbank_backend \
            -v "${{ github.workspace }}/reports:/app/reports" \
            -e DATABASE_URL="mongodb://mongo:27017/finbank_test?replicaSet=rs0" \
            -e WORKSHOP_MODE=true \
            finbank-ci-api \
            npm run test:integration --workspace @finbank/api
      - if: always()
        run: docker compose down --volumes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          path: reports/docker
          retention-days: 14

  build:
    name: build (imagens Docker)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t finbank-api:ci .
      - run: docker build -f apps/web/Dockerfile -t finbank-web:ci .

  e2e-smoke:
    name: e2e-smoke (Cypress, caminho feliz)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: docker compose up -d --wait
      - run: npm run test:e2e --workspace apps/web -- --browser chrome
      - if: always()
        run: docker compose down --volumes
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: apps/web/cypress/screenshots
          retention-days: 14
