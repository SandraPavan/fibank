map $host $finbank_is_local {
  default   0;
  localhost 1;
  127.0.0.1 1;
}

# Túnel público (ngrok): repassa o Host original do cliente, então
# domínios externos nunca caem em $finbank_is_local — usado para manter
# os endpoints administrativos do facilitador fora do link distribuído a
# participantes remotos (dev/02-arquitetura.md: "exposição exclusiva do
# gateway"; "MongoDB, porta 3000 e endpoints administrativos nunca devem
# ser publicados").
map $http_x_forwarded_for $finbank_join_key {
  ""      $remote_addr;
  default $http_x_forwarded_for;
}
limit_req_zone $finbank_join_key zone=finbank_join:10m rate=10r/m;
limit_req_status 429;

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/v1/facilitator/ {
    if ($finbank_is_local = 0) {
      return 403;
    }
    access_log off;
    error_log /dev/null;
    proxy_pass http://api:${API_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/sessions/join {
    limit_req zone=finbank_join burst=5 nodelay;
    access_log off;
    error_log /dev/null;
    proxy_pass http://api:${API_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    # Consultas podem conter chaves fictícias; não registrar URLs da API.
    access_log off;
    error_log /dev/null;
    proxy_pass http://api:${API_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /facilitator {
    if ($finbank_is_local = 0) {
      return 403;
    }
    try_files $uri /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
