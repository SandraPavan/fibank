name: finbank

services:
  mongo:
    image: mongo:8.0.16-noble
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  mongo-init:
    image: mongo:8.0.16-noble
    environment:
      MONGO_INIT_MAX_ATTEMPTS: '${MONGO_INIT_MAX_ATTEMPTS:-60}'
    volumes:
      - ./docker/mongo/init-replica-set.sh:/usr/local/bin/init-replica-set.sh:ro
    networks:
      - backend
    depends_on:
      mongo:
        condition: service_healthy
    command: ['sh', '/usr/local/bin/init-replica-set.sh']
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: mongodb://mongo:27017/finbank?replicaSet=rs0
      PIX_REVIEW_AMOUNT_CENTS: '${PIX_REVIEW_AMOUNT_CENTS-500000}'
      API_HOST: 0.0.0.0
      API_PORT: '${API_PORT:-3000}'
      WORKSHOP_MODE: '${WORKSHOP_MODE:-true}'
    command:
      [
        'sh',
        '-c',
        'npm run db:push --workspace @finbank/api && npm run db:initialize --workspace @finbank/api && node apps/api/dist/main.js',
      ]
    networks:
      - backend
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + process.env.API_PORT + '/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PORT: '${API_PORT:-3000}'
    ports:
      - '127.0.0.1:8080:8080'
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/api/health',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

networks:
  backend:
    name: finbank_backend

volumes:
  mongo-data:
    name: finbank_mongo_data
  mongo-config:
    name: finbank_mongo_config
